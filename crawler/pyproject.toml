[project]
name = "crawler"
version = "0.1.0"
description = "BLS time series file crawler"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "typer>=0.12",
]

[project.scripts]
crawler = "crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
