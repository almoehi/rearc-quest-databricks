name: CI

on:
  push:
    branches-ignore:
      - main

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Crawler tests
        working-directory: crawler
        run: uv run pytest

      - name: Set up Java for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pipeline tests
        working-directory: pipeline
        run: uv run pytest

  lint-python:
    name: Python lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff check
        run: uvx ruff check crawler/src crawler/tests pipeline/dlt pipeline/tests
      - name: Ruff format check
        run: uvx ruff format --check crawler/src crawler/tests pipeline/dlt pipeline/tests

  lint-yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint pipeline/databricks.yml pipeline/resources/ .github/workflows/
